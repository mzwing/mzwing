name: Wakatime

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Wakatime
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TOTAL: true
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
          COMMIT_MESSAGE: "chore: update wakatime"
          COMMITTER_NAME: "mzwing"
          COMMITTER_EMAIL: "mzwing@mzwing.eu.org"
          AUTHOR_NAME: "mzwing"
          AUTHOR_EMAIL: "mzwing@mzwing.eu.org"
